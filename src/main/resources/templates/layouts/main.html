<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Sistema de Controle de Livros">
        Meu Sistema
    </title>


    <link rel="shortcut icon" th:href="@{/img/imagemLivros.png}" type="image/png">

    <!-- CSS padrão para todas as telas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" th:href="@{/css/main.css}">


    <!-- CSS específico de cada página, opcional -->
    <th:block layout:fragment="css"></th:block>

    <script>
        (function () {
            const theme = localStorage.getItem("theme");

            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>

<body>
    <main id="main_content">
        <!-- Aqui entra o conteúdo das outras páginas -->
        <section layout:fragment="content">
            Conteúdo padrão
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Sistema de Controle de Livros • Spring Boot MVC</p>
    </footer>

    <!-- JS padrão para todas as telas -->
    <script type="module" th:src="@{/js/app.js}"></script>


    <!-- JS específico de cada página, opcional -->
    <th:block layout:fragment="scripts"></th:block>

</body>

</html>
