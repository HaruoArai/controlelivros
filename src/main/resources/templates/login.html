<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">

<head>
    <title th:text="${pageTitle}">Título padrão</title>
</head>

<body>
    <section layout:fragment="content">
        <div th:replace="~{fragments/header :: guestHeader('login')}"></div>

        <main class="main-content">
            <section class="form-section">
                <div class="form-container">
                    <div class="form-heading">
                        <h2 class="form-title">Entrar</h2>
                        <p class="form-desc">Acesse o sistema com seu e-mail e senha.</p>
                    </div>
                    <form class="livro-form" th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-input"
                                    placeholder="seu@exemplo.com" required>
                            </div>
                            <div class="form-group full-width">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" id="senha" name="senha" class="form-input" placeholder="••••••••"
                                    required>
                            </div>
                        </div>

                        <div class="form-actions"
                            style="justify-content: flex-start; flex-direction: column; gap: 1rem;">
                            <div th:if="${loginError}" class="field-error" th:text="${loginError}"></div>
                            <button type="submit" class="btn-submit">Entrar</button>
                        </div>
                    </form>
                </div>

                <div class="form-deco">
                    <div class="deco-card">
                        <div class="deco-spine"></div>
                        <div class="deco-content">
                            <p class="deco-quote">"A leitura é para a mente o que o exercício é para o corpo."</p>
                            <span class="deco-author">— Joseph Addison</span>
                        </div>
                    </div>
                    <div class="deco-tip">
                        <strong>💡 Dica:</strong> Se ainda não tem cadastro, clique em Criar Conta e registre-se.
                    </div>


                </div>
            </section>
        </main>
    </section>

</body>

</html>
