<!-- templates/fragments/header.html -->
<header th:fragment="siteHeader(activePage)" class="site-header">
    <div class="header-inner">
        <div class="logo" id="headerLogo">
            <img th:src="@{/img/imagemLivros.png}" alt="Logo Biblioteca" class="logo-icon" width="48" height="48">

            <div>
                <h1 class="logo-title">Biblioteca</h1>
                <span class="logo-sub">Sistema de Controle de Livros</span>
            </div>
        </div>

        <button type="button"
        class="header-toggle"
        id="headerToggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="headerNav">
            ☰
        </button>

        <nav class="header-nav" id="headerNav">
            <div th:replace="~{fragments/darkswitch :: darkmode}"></div>

            <a th:href="@{/form}" class="btn-primary" th:classappend="${activePage == 'form'} ? ' active'">
                + Novo Livro
            </a>

            <div class="profile-menu" id="profileMenu">
                <button type="button" class="nav-link profile-menu-button" id="profileMenuButton"
                    th:classappend="${activePage == 'profile'} ? ' active'">
                    <span sec:authentication="name">Perfil</span> ▾
                </button>

                <div class="profile-dropdown" id="profileDropdown">
                    <a th:href="@{/profile}" class="dropdown-item"
                        th:classappend="${activePage == 'profile'} ? ' active'">
                        Alterar Dados
                    </a>

                    <form th:action="@{/logout}" method="post" onsubmit="return confirm('Deseja realmente sair?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="dropdown-item logout-button">
                            Sair
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </div>
</header>



<header th:fragment="guestHeader(activePage)" class="site-header">
    <div class="header-inner">
        <div class="logo" id="headerLogo">
            <img th:src="@{/img/imagemLivros.png}" alt="Logo Biblioteca" class="logo-icon" width="48" height="48">

            <div>
                <h1 class="logo-title">Biblioteca</h1>
                <span class="logo-sub">Sistema de Controle de Livros</span>
            </div>
        </div>

        <button type="button"
                class="header-toggle"
                id="headerToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="headerNav">
            ☰
        </button>

        <nav class="header-nav" id="headerNav">
            <div th:replace="~{fragments/darkswitch :: darkmode}"></div>

            <a th:href="@{/login}" th:if="${activePage == 'register'}" class="btn-primary">Entrar</a>

            <a th:href="@{/register}"
                class="btn-primary"
                th:classappend="${activePage == 'register'} ? ' active'"
                th:if="${activePage == 'login'}"
               >
                Criar conta
            </a>

            
        </nav>
    </div>
</header>
